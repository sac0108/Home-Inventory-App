<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeSphere AI • Smart Household Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300">
  <div id="app" class="h-full">
    <div id="auth-screen" class="min-h-screen grid lg:grid-cols-2">
      <section class="p-8 lg:p-16 flex flex-col justify-between bg-white dark:bg-slate-900">
        <div>
          <h1 class="text-3xl font-bold">HomeSphere AI</h1>
          <p class="text-sm text-slate-500 mt-2">Premium household inventory intelligence</p>
        </div>
        <div class="glass rounded-3xl p-6 space-y-4">
          <h2 class="text-2xl font-semibold">Welcome back</h2>
          <form id="auth-form" class="space-y-3">
            <input required class="w-full px-4 py-3 rounded-xl border dark:bg-slate-800" placeholder="Email" type="email" />
            <input required class="w-full px-4 py-3 rounded-xl border dark:bg-slate-800" placeholder="Password" type="password" />
            <button class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Sign In</button>
          </form>
          <button id="google-btn" class="w-full py-3 rounded-xl border font-medium"><i class="fa-brands fa-google mr-2"></i>Continue with Google</button>
        </div>
        <p class="text-xs text-slate-500">By continuing you agree to enterprise terms.</p>
      </section>
      <section class="hidden lg:flex items-center justify-center p-10 bg-gradient-to-br from-indigo-500 via-sky-500 to-cyan-400 text-white">
        <div class="max-w-md space-y-4">
          <h3 class="text-4xl font-bold">Run your home like an AI-powered operation.</h3>
          <p>Predict stock-outs, avoid waste, collaborate with family, and control household spending.</p>
        </div>
      </section>
    </div>

    <div id="main-shell" class="hidden min-h-screen lg:grid lg:grid-cols-[260px_1fr]">
      <aside class="hidden lg:flex flex-col border-r dark:border-slate-800 p-4 gap-2 sticky top-0 h-screen">
        <h2 class="font-bold text-xl mb-4">HomeSphere</h2>
        <nav id="sidebar-nav" class="space-y-1"></nav>
        <button id="theme-toggle" class="mt-auto py-2 rounded-xl border">Toggle Theme</button>
      </aside>
      <main class="pb-24 lg:pb-6">
        <header class="sticky top-0 z-30 bg-white/75 dark:bg-slate-950/75 backdrop-blur border-b dark:border-slate-800 p-4 flex justify-between">
          <h1 id="page-title" class="font-semibold text-xl">Dashboard</h1>
          <button id="fab-add" class="px-4 py-2 rounded-xl bg-indigo-600 text-white">+ Add</button>
        </header>
        <section id="view" class="p-4 md:p-6"></section>
      </main>
      <nav id="mobile-nav" class="lg:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t dark:border-slate-800 grid grid-cols-5"></nav>
    </div>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 w-full max-w-lg" id="modal-content"></div>
  </div>

  <div id="toast" class="hidden fixed top-4 right-4 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl"></div>
  <script src="app.js"></script>
</body>
</html>
